services:
  postgres:
    image: postgres:16-alpine
    container_name: attackbot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:latest
    container_name: neo4j_db
    restart: unless-stopped
    environment:
      # Initial credentials set on first boot (user/password).
      # NOTE: Neo4j requires the initial admin username to be `neo4j` (Community).
      NEO4J_AUTH: "${NEO4J_USERNAME}/${NEO4J_PASSWORD}"
    ports:
      - "7474:7474"   # Neo4j Browser (HTTP)
      - "7687:7687"   # Bolt protocol (drivers)
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "/var/lib/neo4j/bin/cypher-shell -u ${NEO4J_USERNAME} -p ${NEO4J_PASSWORD} 'RETURN 1' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ------------------------------------------------------------------ #
  # Vuln engine, Phase 1 evaluation harness
  #
  # Both are measuring instruments, not products: standard-library images, no
  # pip step, nothing to drift. They exist only for
  # tests/vuln_engine/eval/test_phase1.py and run_engine.py's default profile.
  # ------------------------------------------------------------------ #
  fixture_app:
    build: ./docker/fixture_app
    container_name: vuln_fixture_app
    restart: unless-stopped
    environment:
      FIXTURE_PORT: "8080"
    ports:
      - "8080:8080"
    # Docker Desktop resolves host.docker.internal for free; on Linux the host
    # gateway has to be added explicitly, and without it a payload that asks the
    # fixture to fetch a host-hosted URL fails in a way that looks like a target
    # refusal. The default profile points the fixture at the collaborator's
    # compose service name instead, which needs neither.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=2)\""]
      interval: 5s
      timeout: 3s
      retries: 10

  # ------------------------------------------------------------------ #
  # The breadth test: a real vulnerable app we did not plant bugs in.
  # Juice Shop is an Angular SPA — the server answers with the same
  # index.html for everything and reflects only client-side, so the
  # server-echo lens is expected to produce an honest zero. That is the
  # measurement, not a failure: the gap it documents (DOM-side
  # observation) is a requirement for a future technique.
  # ------------------------------------------------------------------ #
  juice_shop:
    image: bkimminich/juice-shop
    container_name: vuln_juice_shop
    restart: unless-stopped
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  oob_collaborator:
    build: ./service/oob_collaborator
    container_name: vuln_oob_collaborator
    restart: unless-stopped
    environment:
      OOB_PORT: "9009"
      OOB_LOG: /data/interactions.jsonl
    ports:
      - "9009:9009"
    volumes:
      - oob_data:/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:9009/healthz',timeout=2)\""]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  neo4j_data:
  oob_data:
